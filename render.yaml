## Render Blueprint: `New > Blueprint` and point it at this repo.
## Secrets marked `sync: false` are prompted for in the dashboard (never committed).
##
## Free web services sleep after inactivity, and free Postgres expires. For demo day use the
## paid "starter" plan (a few $/month) so the first request is never a 50-second cold start.
services:
  - type: web
    name: eno-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENO_MODE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: eno-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: LLM_BASE_URL
        sync: false          # e.g. https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_STANDARD
        sync: false
      - key: LLM_MODEL_BRO
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false          # rzp_test_...
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: HOST_REGISTRY_KEY
        sync: false

databases:
  - name: eno-db
    plan: basic-256mb
